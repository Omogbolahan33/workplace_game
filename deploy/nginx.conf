# The game is a handful of static files, so the only jobs here are the MIME
# types, not caching the service worker, and never answering with a directory
# listing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    text/html                   html;
    text/javascript             js;
    application/manifest+json   webmanifest;
    image/svg+xml               svg;
    image/png                   png;
    text/markdown               md;
  }

  # a new worker must not sit behind a cached one
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
  }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
  autoindex off;
}
